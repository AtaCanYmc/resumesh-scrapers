[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumesh-scrapers"
dynamic = ["version"]
description = "A pluggable Python framework that collects, normalizes, and synchronizes developer profile data from multiple platforms into unified domain models."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Ata Can Yaymacı" },
]
keywords = ["scraper", "github", "medium", "devto", "portfolio", "cv", "resumesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "feedparser>=6.0.14",
    "tenacity>=8.0",
    "beautifulsoup4>=4.0",
    "yt-dlp>=2024.0.0",
]

[project.entry-points."resumesh.scrapers.providers"]
github = "resumesh_scrapers.providers.github:GitHubProvider"
devto = "resumesh_scrapers.providers.devto:DevToProvider"
medium = "resumesh_scrapers.providers.medium:MediumProvider"
substack = "resumesh_scrapers.providers.substack:SubstackProvider"
behance = "resumesh_scrapers.providers.behance:BehanceProvider"
npm = "resumesh_scrapers.providers.npm:NpmProvider"
pypi = "resumesh_scrapers.providers.pypi:PyPiProvider"
youtube = "resumesh_scrapers.providers.youtube:YouTubeProvider"

[project.urls]
Homepage = "https://github.com/AtaCanYmc/resumesh-scrapers"
Repository = "https://github.com/AtaCanYmc/resumesh-scrapers"
Issues = "https://github.com/AtaCanYmc/resumesh-scrapers/issues"
Changelog = "https://github.com/AtaCanYmc/resumesh-scrapers/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/resumesh_scrapers/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/resumesh_scrapers"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["resumesh_scrapers"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
